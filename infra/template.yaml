AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Data Firewall backend. Public policy analysis and cache, plus a static site. No personal data is stored.

Parameters:
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock model used to read privacy policies
  CacheTtlDays:
    Type: Number
    Default: 30
    Description: How long a cached policy analysis is kept

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        BEDROCK_REGION: !Ref AWS::Region
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        POLICY_CACHE_TABLE: !Ref PolicyCacheTable
        POLICY_CACHE_TTL_DAYS: !Ref CacheTtlDays

Resources:
  # Shared memory of what each company's policy says. Public data only.
  # Key: domain + a hash of the policy text, so an edited policy is analysed again.
  PolicyCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: domain
          AttributeType: S
        - AttributeName: contentHash
          AttributeType: S
      KeySchema:
        - AttributeName: domain
          KeyType: HASH
        - AttributeName: contentHash
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ConsentAheadApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      # Rate limit so a burst of requests cannot run up a model bill
      MethodSettings:
        - HttpMethod: "*"
          ResourcePath: "/*"
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/api/build/
      Handler: handlers/health.handler
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get
            RestApiId: !Ref ConsentAheadApi

  FormAnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/api/build/
      Handler: handlers/formAnalyze.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
      Events:
        FormAnalyzeApi:
          Type: Api
          Properties:
            Path: /form/analyze
            Method: post
            RestApiId: !Ref ConsentAheadApi

  PolicyDiscoverFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/api/build/
      Handler: handlers/policyDiscover.handler
      Events:
        PolicyDiscoverApi:
          Type: Api
          Properties:
            Path: /policy/discover
            Method: post
            RestApiId: !Ref ConsentAheadApi

  PolicyAnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/api/build/
      Handler: handlers/policyAnalyze.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
        # Read and write the one cache table, nothing else
        - DynamoDBCrudPolicy:
            TableName: !Ref PolicyCacheTable
      Events:
        PolicyAnalyzeApi:
          Type: Api
          Properties:
            Path: /policy/analyze
            Method: post
            RestApiId: !Ref ConsentAheadApi

  CompanyPathwaysFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/api/build/
      Handler: handlers/companyPathways.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
      Events:
        CompanyPathwaysApi:
          Type: Api
          Properties:
            Path: /company/pathways
            Method: post
            RestApiId: !Ref ConsentAheadApi

  # ── Static site: privacy policy, terms, and the demo pages ──
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed policies: CachingOptimized and SecurityHeadersPolicy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

Outputs:
  ApiEndpoint:
    Description: API URL. Set this as VITE_API_BASE_URL when building the extension (no trailing slash).
    Value: !Sub "https://${ConsentAheadApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  SiteUrl:
    Description: Public website (privacy policy, terms, demo)
    Value: !Sub "https://${SiteDistribution.DomainName}"
  SiteBucketName:
    Value: !Ref SiteBucket
  SiteDistributionId:
    Value: !Ref SiteDistribution
  CacheTableName:
    Value: !Ref PolicyCacheTable
